name: Build & Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test MixSystems.Fiskaly.UnitTests
        run: dotnet test tests/MixSystems.Fiskaly.UnitTests/MixSystems.Fiskaly.UnitTests.csproj -c Release
      - name: Pack
        run: dotnet pack src/MixSystems.Fiskaly/MixSystems.Fiskaly.csproj -c Release -o ./artifacts
